<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console site verification -->
    <meta name="google-site-verification" content="mzXV-0UVudsl3V_-_QELMQMIr28dYLMnlU5u3R92_nc" />
    <title>Ajinkya Sonawane — Full Stack .NET &amp; React Developer</title>
    <meta
      name="description"
      content="Full Stack .NET Developer with 4+ years of experience building scalable web apps with React, TypeScript, ASP.NET Core and SQL Server. I build apps that turn ideas into reality."
    />
    <meta name="author" content="Ajinkya Sonawane" />
    <meta name="keywords" content="Full Stack Developer, .NET Developer, React Developer, TypeScript, ASP.NET Core, C#, SQL Server, Azure, Portfolio" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090f" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Open Graph / social previews. Update the URLs once the site is deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ajinkya Sonawane — Full Stack .NET & React Developer" />
    <meta property="og:description" content="I build apps that turn ideas into reality. 4+ years building scalable web apps with React, TypeScript and .NET." />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ajinkya Sonawane — Full Stack .NET & React Developer" />
    <meta name="twitter:description" content="I build apps that turn ideas into reality." />
    <link rel="canonical" href="https://your-domain.com/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ajinkya Sonawane",
        "jobTitle": "Full Stack .NET Developer",
        "url": "https://your-domain.com/",
        "knowsAbout": ["React", "TypeScript", "JavaScript", ".NET", "ASP.NET Core", "C#", "SQL Server", "Azure", "Docker"],
        "sameAs": ["https://github.com/your-github-username", "https://www.linkedin.com/in/your-linkedin-id"]
      }
    </script>

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || (!t && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.replace('dark', 'light')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled to render.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
